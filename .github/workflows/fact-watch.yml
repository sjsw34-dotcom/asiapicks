name: Fact watch

# Every Monday, fetches the source of each shared fact in src/data/facts/ and
# checks that the value we publish still appears there. If any value is missing
# or a source cannot be reached, it opens (or updates) one issue labelled
# fact-watch. When everything is found again, it closes that issue.
# It never edits a fact: a person re-reads the source and changes the registry.

on:
  schedule:
    # 00:30 UTC Monday = 09:30 KST Monday.
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fact-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Check sources
        run: npx tsx scripts/watch-facts.ts --markdown > body.md

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label fact-watch --state open --json number --jq '.[0].number // empty')
          if [ -s body.md ]; then
            gh label create fact-watch --color F59E0B --description "Shared fact no longer matches its source" 2>/dev/null || true
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file body.md
              gh issue comment "$open" --body "$(TZ=Asia/Seoul date +%Y-%m-%d) 확인: 아직 해결되지 않았습니다."
            else
              gh issue create --label fact-watch --title "사실 감시: 출처와 다른 값 확인 필요 ($(TZ=Asia/Seoul date +%m/%d))" --body-file body.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "$(TZ=Asia/Seoul date +%Y-%m-%d) 확인: 모든 값이 출처에 다시 보입니다."
          fi
